<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PawSphere</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-shell">

  <div class="auth-card">
    <a href="../index.html" class="auth-brand">
      <div class="sidebar-brand-icon">P</div>
      <span class="sidebar-brand-text">PawSphere</span>
    </a>

    <h1 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem;">Welcome back</h1>
    <p style="font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 1.5rem;">Sign in to your account</p>

    <form action="owner/dashboard.html" method="GET">
      <div class="form-group">
        <input type="email" placeholder="Email address" class="form-input" required value="">
      </div>
      
      <div class="form-group">
        <input type="password" placeholder="Password" class="form-input" required value="">
      </div>

      <div style="margin-top: -0.5rem; margin-bottom: 1.25rem; text-align: left;">
        <a href="forgot-password.html" style="font-size: 0.75rem; font-weight: 600; color: var(--primary);">Forgot password?</a>
      </div>

      <div style="margin-bottom: 1.25rem;">
        <p style="font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); margin-bottom: 0.5rem;">
          sign in as
        </p>
        <div class="grid grid-cols-2 gap-2">
          <a href="owner/dashboard.html" class="btn btn-outline-neutral btn-sm" style="font-size: 0.75rem;">Pet Owner</a>
          <a href="shelter/dashboard.html" class="btn btn-outline-neutral btn-sm" style="font-size: 0.75rem;">Shelter</a>
          <a href="vet/dashboard.html" class="btn btn-outline-neutral btn-sm" style="font-size: 0.75rem;">Veterinarian</a>
          <a href="admin/dashboard.html" class="btn btn-outline-neutral btn-sm" style="font-size: 0.75rem;">Administrator</a>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block mb-4">Sign In</button>
    </form>

    <p style="text-align: center; font-size: 0.875rem; color: var(--muted-foreground);">
      No account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register</a>
    </p>
  </div>

</body>
</html>
