<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — PawSphere</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-shell">

  <div class="auth-card">
    <a href="login.html" style="font-size: 0.875rem; font-weight: 600; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 1.5rem;">
      ← Back to sign in
    </a>

    <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.5rem;">Reset your password</h1>
    <p style="font-size: 0.875rem; line-height: 1.5; color: var(--muted-foreground); margin-bottom: 1.5rem;">
      Enter your email and we’ll send a password reset link.
    </p>

    <form action="reset-sent.html" method="GET">
      <div class="form-group">
        <input type="email" placeholder="Email address" class="form-input" required style="padding: 0.75rem;">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Send reset link</button>
    </form>
  </div>

</body>
</html>
