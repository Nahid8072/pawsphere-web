<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Inbox — PawSphere</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-shell">

  <div class="auth-card" style="text-align: center;">
    <div style="width: 3.5rem; height: 3.5rem; border-radius: var(--radius-full); background-color: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h9"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/><path d="m16 19 2 2 4-4"/></svg>
    </div>

    <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.75rem;">Check your inbox</h1>
    <p style="font-size: 0.875rem; line-height: 1.6; color: var(--muted-foreground); margin-bottom: 1.75rem;">
      If an account exists for that email, we’ve sent a reset link. This is a frontend-only demo, so no email will be delivered.
    </p>

    <a href="login.html" class="btn btn-primary btn-block btn-lg">Back to Sign In</a>
  </div>

</body>
</html>
